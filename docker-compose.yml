services:
  portal-service:
    image: portal-service:latest
    container_name: portal-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/share/zoneinfo/America/Los_Angeles:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
    # GID of the docker.sock owner on the host — grants access
    # to the mounted socket without running as root.
    # Synology uses root:root (GID 0). Standard Linux uses the
    # `docker` group (commonly GID 999 or 998).
    # Check with: stat -c '%g' /var/run/docker.sock
    group_add:
      - "0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
